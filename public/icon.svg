<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0f172a" />
      <stop offset="50%" stopColor="#020617" />
      <stop offset="100%" stopColor="#1e1b4b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#fef08a" />
      <stop offset="35%" stopColor="#f59e0b" />
      <stop offset="70%" stopColor="#d97706" />
      <stop offset="100%" stopColor="#b45309" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#f59e0b" stopOpacity="0.35" />
      <stop offset="100%" stopColor="#f59e0b" stopOpacity="0" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#f59e0b" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Inner Ambient Glow -->
  <circle cx="256" cy="256" r="220" fill="url(#glow)" />

  <!-- Geometric Arabesque Ring / 8-pointed motif -->
  <circle cx="256" cy="256" r="196" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="8 6" opacity="0.4" />
  <circle cx="256" cy="256" r="212" fill="none" stroke="#f59e0b" stroke-width="3" opacity="0.3" />

  <!-- Central Emblem: Arabic Maqamat Lyre / Violin / Quarter-tone Crown -->
  <g filter="url(#shadow)">
    <!-- Stylized Arabic Violin / Oud Body Profile -->
    <path d="M 256 110 
             C 210 110, 175 145, 175 190
             C 175 225, 195 245, 185 270
             C 165 305, 140 335, 140 380
             C 140 435, 190 465, 256 465
             C 322 465, 372 435, 372 380
             C 372 335, 347 305, 327 270
             C 317 245, 337 225, 337 190
             C 337 145, 302 110, 256 110 Z" 
          fill="none" 
          stroke="url(#goldGrad)" 
          stroke-width="12" 
          stroke-linejoin="round" />

    <!-- 4 Internal Strings running vertically (G - D - A - E) -->
    <line x1="232" y1="120" x2="232" y2="450" stroke="#fef08a" stroke-width="2" opacity="0.7" />
    <line x1="248" y1="120" x2="248" y2="450" stroke="#f59e0b" stroke-width="3" opacity="0.9" />
    <line x1="264" y1="120" x2="264" y2="450" stroke="#f59e0b" stroke-width="3" opacity="0.9" />
    <line x1="280" y1="120" x2="280" y2="450" stroke="#d97706" stroke-width="3.5" opacity="0.8" />

    <!-- Musical Quarter-tone / Half-flat Emblem symbol (𝄳 / Arabic Sikah indicator) -->
    <circle cx="256" cy="275" r="42" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="6" />
    <text x="256" y="292" font-family="'Noto Naskh Arabic', 'Amiri', serif" font-size="44" font-weight="900" fill="#fef08a" text-anchor="middle">م</text>

    <!-- F-Hole accents -->
    <path d="M 200 320 C 190 350, 205 380, 195 400" fill="none" stroke="#f59e0b" stroke-width="5" stroke-linecap="round" opacity="0.8" />
    <path d="M 312 320 C 322 350, 307 380, 317 400" fill="none" stroke="#f59e0b" stroke-width="5" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- 24-EDO Badge Text at bottom -->
  <rect x="186" y="420" width="140" height="34" rx="17" fill="#020617" stroke="#f59e0b" stroke-width="2.5" />
  <text x="256" y="443" font-family="'JetBrains Mono', 'Plus Jakarta Sans', monospace" font-size="16" font-weight="800" fill="#fef08a" text-anchor="middle" letter-spacing="1">24-EDO</text>
</svg>
